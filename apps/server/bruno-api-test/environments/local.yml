name: local
variables:
  - name: baseUrl
    value: http://127.0.0.1:3000
    description: Aide server base URL
  - name: origin
    value: http://127.0.0.1:3000
    description: Origin header required by the command guard
  - name: bearerToken
    value: "{{process.env.AIDE_BEARER_TOKEN}}"
    secret: true
    description: Bootstrap credential; copy the authToken the server printed at boot
  - name: sessionToken
    value: ""
    secret: true
    description: Set by auth/session-exchange; used on all authenticated requests
  - name: projectDirectory
    value: /tmp/aide-bruno
    description: Directory passed to project.open
  - name: instanceId
    value: fake-primary
    description: Harness instance id for turn.send
  - name: projectId
    value: ""
    description: Set by project.open
  - name: sessionId
    value: ""
    description: Set by session.create
  - name: turnId
    value: ""
    description: Set by turn.send when available
