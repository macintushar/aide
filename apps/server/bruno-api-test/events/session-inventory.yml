info:
  name: session-inventory
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/sessions/{{sessionId}}/inventory?instanceId={{instanceId}}"
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
    - name: Origin
      value: "{{origin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns inventory for the session's project", function () {
          expect([200, 409]).to.include(res.status);
          if (res.status === 200) {
            expect(res.body).to.have.property("instanceId", bru.getVar("instanceId"));
          }
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Inventory discovered for the session's project directory, including project-defined commands and skills.
