info:
  name: session-events
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/sessions/{{sessionId}}/events?afterSequence=0"

runtime:
  scripts:
    - type: tests
      code: |-
        test("opens the SSE stream", function () {
          expect(res.status).to.equal(200);
          expect(res.headers["content-type"]).to.include("text/event-stream");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Subscribes to session-scoped durable events. Bruno treats this as a single response snapshot.
