info:
  name: projects-list
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/projects"
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
    - name: Origin
      value: "{{origin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists projects with session counts", function () {
          expect(res.status).to.equal(200);
          expect(res.body.projects).to.be.an("array");
          const project = res.body.projects.find((p) => p.id === bru.getVar("projectId"));
          expect(project).to.have.property("sessionCount").that.is.a("number");
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Every opened project, most recently opened first, with its session count.
