info:
  name: project-sessions
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/projects/{{projectId}}/sessions"
  headers:
    - name: Authorization
      value: Bearer {{sessionToken}}
    - name: Origin
      value: "{{origin}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("lists the project's sessions", function () {
          expect(res.status).to.equal(200);
          expect(res.body.sessions.map((s) => s.id)).to.include(bru.getVar("sessionId"));
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Sessions of one project, most recently updated first.
