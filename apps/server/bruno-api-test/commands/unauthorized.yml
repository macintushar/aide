info:
  name: unauthorized
  type: http
  seq: 4
  tags:
    - security

http:
  method: POST
  url: "{{baseUrl}}/commands/project.open"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "project.open",
        "commandId": "command_unauthorized",
        "directory": "{{projectDirectory}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("rejects missing bearer token", function () {
          expect(res.status).to.equal(401);
          expect(res.body).to.have.property("error", "unauthorized");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Verifies the command guard rejects requests without Authorization.
